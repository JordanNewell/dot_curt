# dotcurt deploys — TWO independent lanes on Cloudflare Pages,
# branch-per-preview (same shape as jordannewell.com):
#
#   site job  → the hand-rolled marketing/reading site (site/ dir)
#               project dotcurt-site → dotcurt.org (custom domain)
#   docs job  → the Docusaurus docs environment (website/ dir)
#               project dotcurt-docs → docs.dotcurt.org (after domain
#               attach) / dotcurt-docs.pages.dev today
#
# Lanes are independent ON PURPOSE: a docs QA failure can never take down
# the main site, and a main-site change never redeploys the docs.
#
# docs pipeline (deploy is GATED on docs-qa — QA failure means no deploy):
#   1. scripts/check-doc-facts.mjs — fact-drift guard: docs vs npm reality
#   2. build: cd website && npm ci && npm run sync-docs && npm run build
#      (website/package.json exposes 'sync-docs' + 'build'; if those names
#      change, this step breaks by design)
#   3. website/e2e/route-smoke.mjs — contract routes + real TS sample
#   4. website/e2e/link-check.mjs — local href/src resolution
#   5. upload website/build; deploy ships the exact QA'd bytes
#
# Requires the CLOUDFLARE_API_TOKEN repo secret (Pages: Edit).
name: Deploy site

on:
  push:
    branches: ["**"]
    paths:
      - 'site/**'
      - 'website/**'
      - 'scripts/**'
      - 'README.md'
      - 'SPEC.md'
      - 'EXTENSIONS.md'
      - 'CAPABILITIES.md'
      - 'CHANGELOG.md'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ---------- lane 1: main site (site/ → dotcurt-site → dotcurt.org) ----------
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Ensure Pages project exists
        if: env.HAS_CF_TOKEN == 'true'
        run: |
          npx wrangler pages project list | grep -q "dotcurt-site" \
            || npx wrangler pages project create dotcurt-site --production-branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 554619f8c7d3a4010cb161df3037269d

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF_TOKEN == 'true'
        run: npx wrangler pages deploy site --project-name=dotcurt-site --branch="${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 554619f8c7d3a4010cb161df3037269d

      - name: Smoke-check the deployment
        if: env.HAS_CF_TOKEN == 'true'
        # main serves the production alias; other branches get
        # <branch>.dotcurt-site.pages.dev behind Cloudflare Access — a 302
        # to the login means the deployment is serving.
        run: |
          sleep 20
          if [ "${{ github.ref_name }}" = "main" ]; then
            base="https://dotcurt-site.pages.dev"
            ok_codes="200"
          else
            base="https://${{ github.ref_name }}.dotcurt-site.pages.dev"
            ok_codes="200 302"
          fi
          for path in / /adopt/ /posts/2026-10-25-one-file/ /viewer/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${base}${path}")
            echo "${path} -> ${code}"
            echo "$ok_codes" | grep -qw "$code" || { echo "FAIL: ${path} not in [$ok_codes]"; exit 1; }
          done

      - name: No token yet — skip deploy
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret is not set — site deploy skipped."

  # ---------- lane 2: docs (website/ → dotcurt-docs → docs.dotcurt.org) ----------
  docs-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fact-drift guard (docs vs npm reality)
        # STRICT in CI: an unreachable npm registry is a real outage, not a
        # reason to skip the version check. Locally it degrades to cache/warn.
        run: node scripts/check-doc-facts.mjs
        env:
          FACTS_STRICT: '1'

      - name: Build the docs environment
        working-directory: website
        run: npm ci && npm run sync-docs && npm run build

      - name: Route smoke (contract routes in build output + docs sample)
        run: node website/e2e/route-smoke.mjs

      - name: Link check (local hrefs/srcs resolve, no network)
        run: node website/e2e/link-check.mjs

      - name: Upload QA'd build
        uses: actions/upload-artifact@v7
        with:
          name: docs-build
          path: website/build
          retention-days: 3

  docs-deploy:
    needs: docs-qa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download QA'd build
        uses: actions/download-artifact@v8
        with:
          name: docs-build
          path: website/build

      - name: Ensure Pages project exists
        if: env.HAS_CF_TOKEN == 'true'
        run: |
          npx wrangler pages project list | grep -q "dotcurt-docs" \
            || npx wrangler pages project create dotcurt-docs --production-branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 554619f8c7d3a4010cb161df3037269d

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF_TOKEN == 'true'
        run: npx wrangler pages deploy website/build --project-name=dotcurt-docs --branch="${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 554619f8c7d3a4010cb161df3037269d

      - name: Smoke-check the deployment
        if: env.HAS_CF_TOKEN == 'true'
        # A brand-new *.pages.dev subdomain can take minutes to get its TLS
        # cert — retry each path before declaring failure (curl exit 35).
        run: |
          sleep 20
          if [ "${{ github.ref_name }}" = "main" ]; then
            base="https://dotcurt-docs.pages.dev"
            ok_codes="200"
          else
            base="https://${{ github.ref_name }}.dotcurt-docs.pages.dev"
            ok_codes="200 302"
          fi
          for path in / /docs/spec/ /docs/faq/ /docs/status/; do
            code=""
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${base}${path}" || echo 000)
              [ "$code" = "000" ] && { echo "tls not ready (attempt $attempt)"; sleep 30; continue; }
              break
            done
            echo "${path} -> ${code}"
            echo "$ok_codes" | grep -qw "$code" || { echo "FAIL: ${path} not in [$ok_codes]"; exit 1; }
          done

      - name: No token yet — skip deploy
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret is not set — docs QA passed, deploy skipped."

  # ---------- notify: deploy failures are never silent again ----------
  # 2026-11-02 → 2026-11-06 every main-branch deploy failed (fact-drift on
  # site/listen) and nobody noticed until an unrelated deploy needed the
  # lane. This job posts to ntfy on any main-branch failure so a dead
  # deploy page shows up on the phone within seconds. Topic lives in the
  # NTFY_DEPLOY_TOPIC repo secret (public repo — a plaintext topic on
  # ntfy.sh is a public posting target). PR-branch failures stay quiet:
  # they surface in the PR checks where they belong.
  notify:
    needs: [site, docs-qa, docs-deploy]
    if: failure() && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post deploy failure to ntfy
        run: |
          title="dotcurt deploy FAILED on main"
          body="${{ github.event.head_commit.message }}"
          curl -s -m 10 \
            -H "Title: ${title}" \
            -H "Priority: high" \
            -H "Tags: warning,cloudflare" \
            -d "Commit: ${body:0:120}
Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
Failed jobs: site=${{ needs.site.result }} docs-qa=${{ needs.docs-qa.result }} docs-deploy=${{ needs.docs-deploy.result }}" \
            "https://ntfy.sh/${NTFY_DEPLOY_TOPIC}" > /dev/null
        env:
          NTFY_DEPLOY_TOPIC: ${{ secrets.NTFY_DEPLOY_TOPIC }}
