# One-shot: cut dotcurt.org from the dotcurt-site Worker to the dotcurt-site
# Pages project. Manual trigger only. Delete this file after the cutover is
# verified. Reverse = re-deploy the worker from wrangler.jsonc (git revert).
name: Cutover dotcurt.org to Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cutover-domain
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 554619f8c7d3a4010cb161df3037269d
      ZONE: dotcurt.org
      HOST: dotcurt.org
      PAGES_PROJECT: dotcurt-site
    steps:
      - name: Check token scope
        run: |
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" | head -c 300; echo

      - name: Detach $HOST from the Worker (Workers custom domain)
        run: |
          DOMAIN_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?hostname=$HOST" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result'][0]['id'] if d.get('result') else '')")
          echo "worker domain id: ${DOMAIN_ID:-none}"
          if [ -n "$DOMAIN_ID" ]; then
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$DOMAIN_ID")
            echo "detach http: $CODE (200 = detached; empty body is expected)"
          fi

      - name: Attach $HOST to the Pages project
        run: |
          curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"'"$HOST"'"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('attach ok:',d['success'],d.get('errors'))"

      - name: Ensure DNS CNAME $HOST -> $PAGES_PROJECT.pages.dev (proxied)
        run: |
          ZONE_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$ZONE" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result'][0]['id'] if d.get('result') else '')")
          echo "zone id: ${ZONE_ID:-none}"; [ -n "$ZONE_ID" ] || exit 1
          EXISTS=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=$HOST" \
            | python3 -c "import sys,json;print(len(json.load(sys.stdin)['result']))")
          if [ "$EXISTS" = "0" ]; then
            curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d '{"type":"CNAME","name":"'"$HOST"'","content":"'"$PAGES_PROJECT"'.pages.dev","proxied":true,"ttl":1}' \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print('dns ok:',d['success'],d.get('errors'))"
          else
            echo "CNAME already present"
          fi

      - name: Smoke-check dotcurt.org
        run: |
          sleep 45
          for path in / /style.css /adopt/ /posts/2026-10-25-one-file/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$HOST$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "FAIL: $path"; exit 1; }
          done
          echo "cutover verified"
